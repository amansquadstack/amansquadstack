name: Seasonal Header

on:
  schedule:
    - cron: "5 0 * * *" # daily; commits only when the season changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate seasonal assets
        run: python3 .github/scripts/season_assets.py assets

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: seasonal assets update" || exit 0
          git push
