name: Seasonal Header

on:
  schedule:
    - cron: "5 0 * * *" # daily; commits only when the season changes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate header for current season
        run: python3 .github/scripts/season_header.py assets/header.svg

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/header.svg
          git commit -m "chore: seasonal header update" || exit 0
          git push
