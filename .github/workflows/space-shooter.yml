name: Space Shooter

on:
  schedule:
    - cron: "30 1 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-push
  cancel-in-progress: false

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: czl9707/gh-space-shooter@v2.0.5
        with:
          github-token: ${{ secrets.MY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          output-path: assets/space-shooter.gif
          strategy: random
          no-commit: "true"

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/space-shooter.gif
          git commit -m "chore: update space shooter" || exit 0
          git pull --rebase
          git push
