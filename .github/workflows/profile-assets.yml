name: Profile Assets

on:
  schedule:
    - cron: "5 0 * * *" # daily: refresh stats + seasonal theme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats
        env:
          # PAT so private contributions/languages are counted (only totals are stored)
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 .github/scripts/fetch_stats.py .github/data/stats.json

      - name: Generate seasonal assets
        run: python3 .github/scripts/season_assets.py assets

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg .github/data/stats.json
          git commit -m "chore: refresh profile stats & seasonal assets" || exit 0
          git pull --rebase
          git push
