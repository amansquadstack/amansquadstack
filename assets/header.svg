    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/>
      <stop offset="0.55" stop-color="#120a2a"/>
      <stop offset="1" stop-color="#04121f"/>
    </linearGradient>
