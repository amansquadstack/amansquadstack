  <style>
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
    .cursor { fill: #00E5FF; animation: blink 1s steps(1) infinite; }
    .name { font: 800 92px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) .2s forwards; }
    .sub { font: 500 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; letter-spacing: 6px; opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) .7s forwards; }
    .prompt { font: 500 18px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; opacity: 0; animation: rise 1s ease 1.2s forwards; }
    .tag { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #8b949e; opacity: .8; }
    .accent { fill: #00E5FF } .accent2 { fill: #a78bfa }
    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes scan { 0%,100% { transform: translateX(-300px); opacity: 0 } 50% { opacity: 1 } 100% { transform: translateX(300px) } }
  </style>
