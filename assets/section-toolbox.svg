    <g><animateTransform attributeName="transform" type="translate" values="303 -30; 339 42; 285 114" dur="16.9s" begin="-3.7s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7.6s" repeatCount="indefinite"/><use href="#leaf" style="color:#f59e0b" opacity="0.50" transform="scale(0.81)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="431 -30; 464 42; 415 114" dur="9.6s" begin="-3.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="3.4s" repeatCount="indefinite"/><use href="#leaf" style="color:#f59e0b" opacity="0.49" transform="scale(0.64)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="158 -30; 124 42; 175 114" dur="13.0s" begin="-1.1s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.8s" repeatCount="indefinite"/><use href="#leaf" style="color:#f97316" opacity="0.52" transform="scale(0.73)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="864 -30; 824 42; 884 114" dur="10.7s" begin="-2.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7.2s" repeatCount="indefinite"/><use href="#leaf" style="color:#b45309" opacity="0.54" transform="scale(0.75)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="138 -30; 164 42; 125 114" dur="15.2s" begin="-5.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#f59e0b" opacity="0.53" transform="scale(0.61)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="300 -30; 332 42; 284 114" dur="12.2s" begin="-5.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7.8s" repeatCount="indefinite"/><use href="#leaf" style="color:#ea580c" opacity="0.73" transform="scale(0.75)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="33 -30; 72 42; 14 114" dur="16.4s" begin="-1.4s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="6.7s" repeatCount="indefinite"/><use href="#leaf" style="color:#f59e0b" opacity="0.41" transform="scale(0.61)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="1054 -30; 1025 42; 1068 114" dur="14.9s" begin="-3.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#ea580c" opacity="0.47" transform="scale(0.79)"/></g></g>
    <text class="t" x="600" y="54" text-anchor="middle" fill="url(#title)">Toolbox</text>
    <rect x="480" y="68" width="240" height="2" rx="1" fill="url(#edge)"/>
