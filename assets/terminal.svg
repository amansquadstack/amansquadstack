    <linearGradient id="border" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c56a3d"/><stop offset=".5" stop-color="#d9a441"/><stop offset="1" stop-color="#c56a3d"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font: 500 17px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .p { fill: #c56a3d } .t { fill: #d9a441 } .w { fill: #ece4d4 } .m { fill: #8f877a } .k { fill: #c56a3d } .g { fill: #9db89a } .y { fill: #d9b77e }
    .ln { opacity: 0; animation: show .01s linear forwards; }
    @keyframes show { to { opacity: 1 } }
    .type { clip-path: inset(0 100% 0 0); animation: type .9s steps(28) forwards; }
    @keyframes type { to { clip-path: inset(0 0 0 0) } }
    .cursor { fill: #c56a3d; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .glow { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .25 } 50% { stroke-opacity: .7 } }
  </style>
  <g clip-path="url(#card)">
