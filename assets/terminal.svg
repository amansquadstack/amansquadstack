    <g><animateTransform attributeName="transform" type="translate" values="95 -30; 58 200; 114 430" dur="15.4s" begin="-7.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.50" transform="scale(0.49)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="579 -30; 600 200; 569 430" dur="11.7s" begin="-1.7s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.7s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.36" transform="scale(0.61)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="806 -30; 835 200; 791 430" dur="11.8s" begin="-0.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.2s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.36" transform="scale(0.49)"/></g></g>
