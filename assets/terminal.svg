<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="whoami terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0e0c"/><stop offset="0.55" stop-color="#171410"/><stop offset="1" stop-color="#101111"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#7a3427" stop-opacity="0.38"/><stop offset="1" stop-color="#7a3427" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#b8623a" stop-opacity="0.26"/><stop offset="1" stop-color="#b8623a" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#c99a3e" stop-opacity="0.24"/><stop offset="1" stop-color="#c99a3e" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#d9a441"/><stop offset="0.5" stop-color="#ece4d4"/><stop offset="1" stop-color="#c56a3d"/>
