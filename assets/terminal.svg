    <g><animateTransform attributeName="transform" type="translate" values="714 -30; 677 200; 733 430" dur="12.9s" begin="-6.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="6.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.43" transform="scale(0.85)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="608 -30; 634 200; 595 430" dur="17.9s" begin="-3.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.4s" repeatCount="indefinite"/><use href="#leaf" style="color:#d9a441" opacity="0.31" transform="scale(0.89)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="503 -30; 478 200; 515 430" dur="11.3s" begin="-7.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.1s" repeatCount="indefinite"/><use href="#leaf" style="color:#a8552f" opacity="0.38" transform="scale(0.51)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="116 -30; 146 200; 101 430" dur="13.5s" begin="-11.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="8.0s" repeatCount="indefinite"/><use href="#leaf" style="color:#d9a441" opacity="0.39" transform="scale(0.83)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="382 -30; 338 200; 405 430" dur="12.1s" begin="-9.1s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5.1s" repeatCount="indefinite"/><use href="#leaf" style="color:#a8552f" opacity="0.27" transform="scale(0.81)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="603 -30; 640 200; 585 430" dur="12.5s" begin="-7.3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="3.0s" repeatCount="indefinite"/><use href="#leaf" style="color:#8a3b2e" opacity="0.44" transform="scale(0.66)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="610 -30; 590 200; 620 430" dur="13.8s" begin="-9.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7.9s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.35" transform="scale(0.57)"/></g></g>
