    </ellipse>
    <ellipse cx="636" cy="84" rx="264" ry="50" fill="url(#blobC)">
      <animate attributeName="cx" values="636;516;756;636" dur="16s" repeatCount="indefinite"/>
    </ellipse></g>
    <g><animateTransform attributeName="transform" type="translate" values="338 -30; 379 42; 318 114" dur="12.7s" begin="-10.3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="5.9s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.69" transform="scale(0.58)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="624 -30; 585 42; 644 114" dur="17.2s" begin="-6.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6.3s" repeatCount="indefinite"/><use href="#leaf" style="color:#c56a3d" opacity="0.73" transform="scale(0.65)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="507 -30; 474 42; 524 114" dur="10.1s" begin="-7.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#8a3b2e" opacity="0.41" transform="scale(0.55)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="371 -30; 389 42; 362 114" dur="14.5s" begin="-9.3s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="6.6s" repeatCount="indefinite"/><use href="#leaf" style="color:#a8552f" opacity="0.65" transform="scale(0.61)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="48 -30; 68 42; 38 114" dur="12.3s" begin="-0.5s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.1s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.44" transform="scale(0.80)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="902 -30; 945 42; 880 114" dur="13.6s" begin="-3.8s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.3s" repeatCount="indefinite"/><use href="#leaf" style="color:#a8552f" opacity="0.56" transform="scale(0.61)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="1122 -30; 1089 42; 1138 114" dur="10.3s" begin="-7.6s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="7.7s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.41" transform="scale(0.79)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="269 -30; 294 42; 256 114" dur="17.9s" begin="-11.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="6.3s" repeatCount="indefinite"/><use href="#leaf" style="color:#d9a441" opacity="0.51" transform="scale(0.81)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="329 -30; 363 42; 312 114" dur="10.3s" begin="-0.2s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#b98a3e" opacity="0.69" transform="scale(0.45)"/></g></g>
    <text class="t" x="600" y="54" text-anchor="middle" fill="url(#title)">GitHub in Motion</text>
    <rect x="480" y="68" width="240" height="2" rx="1" fill="url(#edge)"/>
