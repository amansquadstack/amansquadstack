<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="84" viewBox="0 0 1200 84" role="img" aria-label="GitHub in Motion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0e0c"/><stop offset="0.55" stop-color="#171410"/><stop offset="1" stop-color="#101111"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#7a3427" stop-opacity="0.38"/><stop offset="1" stop-color="#7a3427" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#b8623a" stop-opacity="0.26"/><stop offset="1" stop-color="#b8623a" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#c99a3e" stop-opacity="0.24"/><stop offset="1" stop-color="#c99a3e" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#d9a441"/><stop offset="0.5" stop-color="#ece4d4"/><stop offset="1" stop-color="#c56a3d"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#d9a441" stop-opacity="0"/><stop offset="0.5" stop-color="#c56a3d"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ece4d4" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="84" rx="16"/></clipPath>
    <g id="snow" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M0-9V9M-7.8-4.5L7.8 4.5M-7.8 4.5L7.8-4.5"/>
      <path d="M-2.5-7L0-4.5L2.5-7M-2.5 7L0 4.5L2.5 7M-7.3-1.2L-4-2.3L-4.8-5.5M7.3 1.2L4 2.3L4.8 5.5M-7.3 1.2L-4 2.3L-4.8 5.5M7.3-1.2L4-2.3L4.8-5.5" stroke-width="1.1"/>
    </g>
    <path id="leaf" fill="currentColor" d="M0-12L2.5-6L6-8.5L5-3L10.5-4.5L8.5 0L11.5 2L5.5 3.2L6.5 7.5L1.2 5.2L.8 12H-.8L-1.2 5.2L-6.5 7.5L-5.5 3.2L-11.5 2L-8.5 0L-10.5-4.5L-5-3L-6-8.5L-2.5-6Z"/>
    <path id="petal" fill="currentColor" d="M0-7C4.5-7 6-1 0 7C-6-1-4.5-7-1.2-6.2L0-4.6L1.2-6.2Z"/>
    <radialGradient id="ffglow"><stop offset="0" stop-color="#fff7c2"/><stop offset=".35" stop-color="#fcd34d" stop-opacity=".9"/><stop offset="1" stop-color="#fcd34d" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .t { font: 800 34px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) .1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="84" fill="url(#bg)"/>
    <rect width="1200" height="84" fill="url(#grid)"/>
    <g opacity="0.6">
