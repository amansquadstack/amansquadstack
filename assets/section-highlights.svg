    <g><animateTransform attributeName="transform" type="translate" values="522 -30; 507 42; 530 114" dur="16.1s" begin="-12.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="6.1s" repeatCount="indefinite"/><use href="#leaf" style="color:#ea580c" opacity="0.61" transform="scale(0.55)"/></g></g>
