    <g><animateTransform attributeName="transform" type="translate" values="828 -30; 860 42; 812 114" dur="11.1s" begin="-7.9s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="360;0" dur="4.5s" repeatCount="indefinite"/><use href="#leaf" style="color:#f97316" opacity="0.58" transform="scale(0.72)"/></g></g>
    <g><animateTransform attributeName="transform" type="translate" values="538 -30; 562 42; 526 114" dur="12.7s" begin="-0.0s" repeatCount="indefinite"/><g><animateTransform attributeName="transform" type="rotate" values="0;360" dur="5.7s" repeatCount="indefinite"/><use href="#leaf" style="color:#f97316" opacity="0.70" transform="scale(0.54)"/></g></g>
